plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.tasrobotics'
// CI passes -PreleaseVersion=2027.0.0 from the git tag; local builds are snapshots.
version = project.findProperty('releaseVersion') ?: '2027.0.0-SNAPSHOT'

def wpilibVersion = '2027.0.0-alpha-7'
def phoenixVersion = '26.70.0-alpha-2'
def wpilibYear = '2027_alpha7'
def siteUrl = 'https://tasrobotics.github.io/pointweaver-lib'

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    // 2027 robots run Java 25 (build with the WPILib 2027 JDK)
    options.release = 25
    options.encoding = 'UTF-8'
    // -classfile: some dependency jars carry annotations whose classes aren't on our compile classpath
    options.compilerArgs.addAll(['-Xlint:all,-serial,-processing,-options,-classfile'])
}

repositories {
    mavenCentral()
    maven { url = 'https://frcmaven.wpi.edu/artifactory/release/' }
    maven { url = 'https://maven.ctr-electronics.com/release/' }
}

dependencies {
    // Provided by the robot project (WPILib + the team's own Phoenix 6 vendordep), never bundled.
    compileOnly "org.wpilib.wpilibj:wpilibj-java:$wpilibVersion"
    compileOnly "org.wpilib.wpimath:wpimath-java:$wpilibVersion"
    compileOnly "org.wpilib.wpiutil:wpiutil-java:$wpilibVersion"
    compileOnly "org.wpilib.wpiunits:wpiunits-java:$wpilibVersion"
    compileOnly "org.wpilib.ntcore:ntcore-java:$wpilibVersion"
    compileOnly "org.wpilib.hal:hal-java:$wpilibVersion"
    compileOnly "org.wpilib.telemetry:telemetry-java:$wpilibVersion"
    compileOnly "org.wpilib.tunables:tunables-java:$wpilibVersion"
    // Commands V2 is its own vendordep in 2027; only pointweaver.command needs it
    compileOnly "org.wpilib.commandsv2:commandsv2-java:$wpilibVersion"
    compileOnly "com.ctre.phoenix6:wpiapi-java:$phoenixVersion"

    // Tests only touch pointweaver.core, which is plain Java.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

// Everything that goes on GitHub Pages: build/site/repo (Maven) + build/site/PointWeaver.json (vendordep)
def siteDir = layout.buildDirectory.dir('site')

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'PointWeaver'
                description = 'Point-to-point path follower for CTRE swerve drivetrains (FRC)'
                url = 'https://github.com/TASRobotics/pointweaver-lib'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'site'
            // plain File so this also works when a GradleRIO robot (Gradle 8.x) pulls this repo in with includeBuild
            url = layout.buildDirectory.dir('site/repo').get().asFile
        }
    }
}

// Writes build/site/2027/PointWeaver.json (latest) and 2027/PointWeaver-<version>.json (pinned).
// 2027 lives in its own folder so a 2027 release never replaces the 2026 vendordep at the site root.
// Only declares those two files as outputs, so it never touches the Maven repo next to them.
def vendordepVersion = project.version.toString()
def vendordepDir = '2027'
tasks.register('generateVendordep') {
    description = 'Writes the vendordep JSON for this version into build/site.'
    def template = file('vendordep/PointWeaver.json.template')
    def outputs = [
        siteDir.map { it.file("${vendordepDir}/PointWeaver.json") },
        siteDir.map { it.file("${vendordepDir}/PointWeaver-${vendordepVersion}.json") },
    ]
    inputs.file(template)
    inputs.property('version', vendordepVersion)
    it.outputs.files(outputs)
    doLast {
        def text = template.text
            .replace('${version}', vendordepVersion)
            .replace('${wpilibYear}', wpilibYear)
            .replace('${siteUrl}', siteUrl)
            .replace('${vendordepDir}', vendordepDir)
        outputs.each { out ->
            def f = out.get().asFile
            f.parentFile.mkdirs()
            f.text = text
        }
    }
}
